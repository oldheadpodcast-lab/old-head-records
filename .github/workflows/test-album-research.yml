
name: Test Album Research

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Research five albums
        run: python scripts/enrich_albums.py

      - name: Upload research results
        uses: actions/upload-artifact@v4
        with:
          name: album-research-test
          path: album_metadata.json
          if-no-files-found: error
